# OrbStack:  HOST_PORT=7804 docker compose up --build -d   ->  http://127.0.0.1:7804/
# The server binds 0.0.0.0 INSIDE the container (FIELD_NOTES_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay 7804.
# Docker shows Mock only (the sanitized pages baked into the image). Real (your full notes) is host-run only: ./scripts/run.sh.
# No host mounts, no docker socket, no host network.
name: field-notes-lab

services:
  field-notes-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7804}:7804"
    environment:
      PORT: "7804"
      FIELD_NOTES_BIND: 0.0.0.0
      MODE: ${MODE:-mock}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-field-notes-lab.local.ping-devops.com}
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7804/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
